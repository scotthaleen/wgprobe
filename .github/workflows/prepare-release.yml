name: Prepare patch release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-patch-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Open version bump PR
    runs-on: ubuntu-24.04
    environment: release-preparation
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Install Rust components
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component clippy,rustfmt
          rustup default stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
        working-directory: node
      - name: Bump patch version
        id: version
        run: |
          version=$(./scripts/bump-version.sh patch)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run release checks
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="release/v$VERSION"
          title="Release v$VERSION"
          body="Bump all package versions to \`$VERSION\`. Merging this PR creates \`v$VERSION\` and publishes the release artifacts."
          git add \
            Cargo.lock \
            crates/*/Cargo.toml \
            node/index.d.ts \
            node/index.js \
            node/package.json \
            node/package-lock.json

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            test "$(git write-tree)" = "$(git rev-parse "refs/remotes/origin/$branch^{tree}")" || {
              echo "release branch has unexpected content: $branch" >&2
              exit 1
            }
            existing=$(gh pr list --base master --head "$branch" --state open --json url --jq '.[0].url // empty')
            if [[ -n "$existing" ]]; then
              echo "release pull request already exists: $existing"
              exit 0
            fi
            gh pr create --base master --head "$branch" --title "$title" --body "$body"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "$title"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base master --head "$branch" --title "$title" --body "$body"

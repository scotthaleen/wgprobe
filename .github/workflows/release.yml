name: Release

on:
  push:
    branches: [master]
    paths:
      - crates/nordprobe/Cargo.toml
      - crates/wgprobe/Cargo.toml
      - crates/wgprobe-python/Cargo.toml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      create_tag: ${{ steps.release.outputs.create_tag }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate release
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          version=$(jq -r '.packages[] | select(.name == "wgprobe") | .version' <<<"$metadata")
          jq -e --arg version "$version" 'all(.packages[]; .version == $version)' <<<"$metadata"
          test "$(jq -r .version node/package.json)" = "$version" || {
            echo "node/package.json does not use version $version" >&2
            exit 1
          }
          jq -e --arg version "$version" \
            '.version == $version and .packages[""].version == $version' \
            node/package-lock.json >/dev/null || {
              echo "node/package-lock.json does not use version $version" >&2
              exit 1
            }
          loader_versions=$(sed -n \
            's/.*expected \([0-9][0-9.]*\) but got.*/\1/p' node/index.js | sort -u)
          test "$loader_versions" = "$version" || {
            echo "node/index.js expects native package version(s): $loader_versions" >&2
            exit 1
          }
          for manifest in \
            crates/nordprobe/Cargo.toml \
            crates/wgprobe-node/Cargo.toml \
            crates/wgprobe-python/Cargo.toml; do
            grep -Fqx "wgprobe = { version = \"$version\", path = \"../wgprobe\" }" "$manifest" || {
              echo "$manifest does not require wgprobe $version" >&2
              exit 1
            }
          done

          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/master ]]; then
            previous=
            for manifest in \
              crates/wgprobe/Cargo.toml \
              crates/nordprobe/Cargo.toml \
              crates/wgprobe-node/Cargo.toml \
              crates/wgprobe-python/Cargo.toml; do
              candidate=$(git show "$GITHUB_SHA^:$manifest" |
                sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p')
              if [[ -z "$previous" ]]; then
                previous=$candidate
              elif [[ "$candidate" != "$previous" ]]; then
                echo "parent package versions do not match" >&2
                exit 1
              fi
            done
            [[ "$previous" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
              echo "invalid previous package version: $previous" >&2
              exit 1
            }
            expected="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            test "$version" = "$expected" || {
              echo "release version $version is not the next patch after $previous" >&2
              exit 1
            }
            tag="v$version"
            if git rev-parse --verify --quiet "refs/tags/$tag"; then
              test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA" || {
                echo "release tag $tag identifies a different commit" >&2
                exit 1
              }
              create_tag=false
            else
              create_tag=true
            fi
          else
            tag=$REQUESTED_TAG
            create_tag=false
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "invalid release tag: $tag" >&2
              exit 1
            }
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$tag^{commit}")" || {
              echo "$tag does not identify the checked-out commit" >&2
              exit 1
            }
            test "$version" = "${tag#v}" || {
              echo "tag $tag does not match package version $version" >&2
              exit 1
            }
          fi

          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install Rust components
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component clippy,rustfmt
          rustup default stable
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  tag:
    name: Create release tag
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release tag
        if: needs.validate.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$GITHUB_SHA"
      - name: Use existing release tag
        if: needs.validate.outputs.create_tag != 'true'
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: echo "using existing tag $RELEASE_TAG"

  native:
    name: Native binaries (${{ matrix.platform }})
    needs: [validate, tag]
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - name: Install Rust target
        run: |
          rustup set profile minimal
          rustup toolchain install stable --target "${{ matrix.target }}"
          rustup default stable
      - name: Install musl tools
        if: startsWith(matrix.platform, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and package binaries
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=${RELEASE_TAG#v}
          cargo build --locked --release -p wgprobe -p nordprobe --target "${{ matrix.target }}"
          mkdir -p dist
          for binary in wgprobe nordprobe; do
            "target/${{ matrix.target }}/release/$binary" --version
            strip "target/${{ matrix.target }}/release/$binary"
            package="$binary-$version-$PLATFORM"
            mkdir -p "dist/$package"
            cp "target/${{ matrix.target }}/release/$binary" "dist/$package/"
            cp LICENSE "dist/$package/"
            cp "crates/$binary/README.md" "dist/$package/README.md"
            tar -C dist -czf "dist/$package.tar.gz" "$package"
            verification="$RUNNER_TEMP/verify-$binary"
            mkdir -p "$verification"
            tar -xzf "dist/$package.tar.gz" -C "$verification"
            "$verification/$package/$binary" --version
            if [[ "$PLATFORM" == linux-* ]]; then
              file "$verification/$package/$binary" | grep -E 'statically linked|static-pie linked'
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Python wheel (${{ matrix.platform }})
    needs: [validate, tag]
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: false
      - name: Test installed wheel
        shell: bash
        run: |
          uv python install 3.10 3.14
          wheel=$(ls dist/*.whl)
          case "$(basename "$wheel")" in
            *-cp310-abi3-*) ;;
            *) echo "wheel does not use the cp310 ABI3 tag: $wheel" >&2; exit 1 ;;
          esac
          for python in 3.10 3.14; do
            uv run --python "$python" --isolated --with "$wheel" --with 'pytest>=9,<10' pytest python/tests
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  node-addon:
    name: Node addon (${{ matrix.platform }})
    needs: [validate, tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            napi_cross: true
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            napi_cross: true
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            napi_cross: false
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            napi_cross: false
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            napi_cross: false
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
        working-directory: node
      - name: Build addon
        shell: bash
        working-directory: node
        env:
          TARGET: ${{ matrix.target }}
          USE_NAPI_CROSS: ${{ matrix.napi_cross }}
        run: |
          args=()
          if [[ "$USE_NAPI_CROSS" == true ]]; then
            args+=(--use-napi-cross)
            export TARGET_CC=clang
          fi
          npx napi build \
            --manifest-path ../Cargo.toml \
            --package wgprobe-node \
            --package-json-path package.json \
            --output-dir . \
            --platform \
            --release \
            --target "$TARGET" \
            "${args[@]}" \
            -- --locked
      - name: Verify glibc floor
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        working-directory: node
        run: |
          highest=$(objdump -T ./*.node | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          test "$(printf 'GLIBC_2.17\n%s\n' "$highest" | sort -V | tail -1)" = GLIBC_2.17
      - name: Test addon
        run: npm test
        working-directory: node
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-node-${{ matrix.platform }}
          path: node/*.node
          if-no-files-found: error

  publish-pypi:
    name: Publish Python wheels to PyPI
    needs: [validate, tag, wheels]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-wheel-*
          path: pypi-dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: false
      - name: Check existing publication
        id: pypi-release
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          version=${RELEASE_TAG#v}
          publish=true
          if metadata=$(curl --fail --silent --show-error \
            "https://pypi.org/pypi/wgprobe/$version/json"); then
            publish=false
            for wheel in pypi-dist/*.whl; do
              filename=$(basename "$wheel")
              if ! jq -e --arg filename "$filename" \
                '[.urls[].filename] | index($filename) != null' <<<"$metadata" >/dev/null; then
                publish=true
              fi
            done
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Publish wheels
        if: steps.pypi-release.outputs.publish == 'true'
        run: >-
          uv publish
          --trusted-publishing always
          --check-url https://pypi.org/simple/wgprobe/
          pypi-dist/*.whl

  publish-npm:
    name: Publish Node package to npm
    needs: [validate, tag, node-addon]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
        working-directory: node
      - run: npx napi create-npm-dirs
        working-directory: node
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-node-*
          path: node/artifacts
      - run: npx napi artifacts --output-dir artifacts --npm-dir npm
        working-directory: node
      - name: Verify package artifacts
        working-directory: node
        run: |
          for artifact in \
            wgprobe.darwin-arm64.node \
            wgprobe.darwin-x64.node \
            wgprobe.linux-arm64-gnu.node \
            wgprobe.linux-x64-gnu.node \
            wgprobe.win32-x64-msvc.node; do
            test -f "$artifact"
          done
      - name: Check existing publication
        id: npm-release
        working-directory: node
        run: |
          version=$(node -p "require('./package.json').version")
          packages=(
            wgprobe
            wgprobe-darwin-arm64
            wgprobe-darwin-x64
            wgprobe-linux-arm64-gnu
            wgprobe-linux-x64-gnu
            wgprobe-win32-x64-msvc
          )
          publish=false
          for package in "${packages[@]}"; do
            if ! npm view "$package@$version" version >/dev/null 2>&1; then
              publish=true
            fi
          done
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Validate npm packages
        if: steps.npm-release.outputs.publish == 'true'
        run: npx napi prepublish -t npm --no-gh-release --dry-run
        working-directory: node
      - name: Publish npm packages
        if: steps.npm-release.outputs.publish == 'true'
        working-directory: node
        run: |
          version=$(node -p "require('./package.json').version")
          for directory in npm/*; do
            package=$(node -p "require('./$directory/package.json').name")
            if npm view "$package@$version" version >/dev/null 2>&1; then
              echo "$package@$version already exists"
            else
              npm publish --access public "./$directory"
            fi
          done
          npx napi prepublish -t npm --no-gh-release --skip-optional-publish
          if npm view "wgprobe@$version" version >/dev/null 2>&1; then
            echo "wgprobe@$version already exists"
          else
            npm publish --access public --ignore-scripts
          fi
      - name: Verify npm packages
        working-directory: node
        run: |
          version=$(node -p "require('./package.json').version")
          for package in \
            wgprobe \
            wgprobe-darwin-arm64 \
            wgprobe-darwin-x64 \
            wgprobe-linux-arm64-gnu \
            wgprobe-linux-x64-gnu \
            wgprobe-win32-x64-msvc; do
            for attempt in {1..12}; do
              if test "$(npm view "$package@$version" version 2>/dev/null)" = "$version"; then
                break
              fi
              if test "$attempt" = 12; then
                echo "$package@$version did not become visible on npm" >&2
                exit 1
              fi
              sleep 5
            done
          done

  publish:
    name: Publish GitHub release
    needs: [validate, tag, native, wheels, node-addon, publish-pypi, publish-npm]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cp install.sh release-assets/install.sh
          cd release-assets
          sha256sum -- * > SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$RELEASE_TAG" \
            --generate-notes
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust components
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component clippy,rustfmt
          rustup default stable
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-platforms:
    name: Rust build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            musl: true
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            musl: false
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            musl: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable --target "${{ matrix.target }}"
          rustup default stable
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build native tools
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: >-
          cargo build --locked --release -p wgprobe -p nordprobe
          --target "${{ matrix.target }}"

  python-quality:
    name: Python quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true
      - run: uv run --isolated --with 'mypy>=1.19,<2' mypy
      - run: uv run --isolated --with 'ruff>=0.14,<1' ruff check .

  python-wheel:
    name: Python wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: macos-aarch64
            runner: macos-15
          - name: windows-x86_64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true
      - run: uv python install 3.10
      - name: Build wheel
        run: >-
          uv run --python 3.10 --isolated --with maturin==1.14.1
          maturin build --release --locked --out dist
      - name: Test installed wheel
        shell: bash
        run: |
          wheel=$(ls dist/*.whl)
          uv run --python 3.10 --isolated --with "$wheel" --with 'pytest>=9,<10' pytest python/tests

  node-quality:
    name: Node quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
        working-directory: node
      - run: npm run typecheck
        working-directory: node
      - run: npm pack --dry-run --ignore-scripts
        working-directory: node

  node-addon:
    name: Node addon (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            napi_cross: true
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            napi_cross: true
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            napi_cross: false
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            napi_cross: false
          # Disabled until npm permits the wgprobe-win32-x64-msvc package name.
          # - platform: windows-x86_64
          #   runner: windows-2025
          #   target: x86_64-pc-windows-msvc
          #   napi_cross: false
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
        working-directory: node
      - name: Build addon
        shell: bash
        working-directory: node
        env:
          TARGET: ${{ matrix.target }}
          USE_NAPI_CROSS: ${{ matrix.napi_cross }}
        run: |
          args=()
          if [[ "$USE_NAPI_CROSS" == true ]]; then
            args+=(--use-napi-cross)
            export TARGET_CC=clang
          fi
          npx napi build \
            --manifest-path ../Cargo.toml \
            --package wgprobe-node \
            --package-json-path package.json \
            --output-dir . \
            --platform \
            --release \
            --target "$TARGET" \
            "${args[@]}" \
            -- --locked
      - name: Verify glibc floor
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        working-directory: node
        run: |
          highest=$(objdump -T ./*.node | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          test "$(printf 'GLIBC_2.17\n%s\n' "$highest" | sort -V | tail -1)" = GLIBC_2.17
      - name: Test addon
        run: npm test
        working-directory: node
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-addon-${{ matrix.platform }}
          path: node/*.node
          if-no-files-found: error

  installer:
    name: Installer syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh -n install.sh
      - run: ./install.sh --help
      - name: Reject malformed versions before download
        run: |
          if ./install.sh --version 1..2 2>installer-error.log; then
            echo "malformed version was accepted" >&2
            exit 1
          fi
          grep -F "invalid release version" installer-error.log

  homebrew:
    name: Homebrew formulas (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            runner: macos-15
          - name: linux-x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - run: brew style Formula/wgprobe.rb Formula/nordprobe.rb
      - name: Register checkout as a tap
        run: brew tap scotthaleen/wgprobe "file://$GITHUB_WORKSPACE"
      - run: >-
          brew audit --strict
          scotthaleen/wgprobe/wgprobe
          scotthaleen/wgprobe/nordprobe
      - run: brew install --build-from-source scotthaleen/wgprobe/wgprobe
      - run: brew install --build-from-source scotthaleen/wgprobe/nordprobe
      - run: brew test scotthaleen/wgprobe/wgprobe
      - run: brew test scotthaleen/wgprobe/nordprobe

[package]
name = "wgprobe"
version = "0.1.0"
edition = "2024"
description = "Probe a WireGuard endpoint without creating a tunnel interface"
license = "MIT"
repository.workspace = true

[dependencies]
base64 = "0.22.1"
boringtun = "0.7.1"
clap = { version = "4.5.45", features = ["derive"] }
libc = "0.2.177"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.14"
zeroize = "1.8.1"
